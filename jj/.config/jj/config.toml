"$schema" = "https://jj-vcs.github.io/jj/latest/config-schema.json"

[ui]
default-command = "log"
diff-formatter = ["difft", "--color=always", "$left", "$right"]

[templates]
git_push_bookmark = '"ptw/push-" ++ change_id.short()'

[user]
name = "prestontunnellwilson"
email = "prestontunnellwilson@users.noreply.github.com"

[aliases]
tug = ["bookmark", "move", "--from", "closest_bookmark(@)", "--to", "closest_pushable(@)"]
pr = ["diff", "--from", "latest(ancestors(@) & ancestors(trunk()), 1)", "--to", "@"]
gf = ["git", "fetch"]
gp = ["git", "push"]
# Run pre-commit on the files changed in @. `--files` is required: without it
# pre-commit stashes unstaged changes and tests the index, which in a jj
# workspace sits at @- and would silently check the pre-change content.
# set -f + IFS=newline: ~98 tracked files have spaces in their names.
precommit = ["util", "exec", "--", "bash", "-c", '''set -f; IFS=$'\n'; pre-commit run --hook-stage pre-push --files $(jj diff --name-only -r @)''']
# Re-point this worktree's git HEAD/index at @- after jj moves the working copy.
sync-git = ["util", "exec", "--", "bash", "-c", '''git update-ref --no-deref HEAD "$(jj --ignore-working-copy log --no-graph -r @- -T commit_id)" && git reset -q''']

[revset-aliases]
'closest_bookmark(to)' = 'heads(ancestors(to) & bookmarks())'
'closest_pushable(to)' = 'heads(ancestors(to) & mutable() & ~description(exact:"") & (~empty() | merges()))'

'pending_anchors()' = 'mine() & main@origin.. & remote_bookmarks(remote=origin).. & ~empty()'
'pending_stack()' = '::pending_anchors() & main@origin.. & remote_bookmarks(remote=origin)..' 
'pending()' = 'pending_stack() | (roots(pending_stack())- & ::main@origin)'

[template-aliases]
'format_short_signature(signature)' = '''
coalesce(signature.email().local(), email_placeholder)'''
"format_timestamp(timestamp)" = "timestamp.ago()"
